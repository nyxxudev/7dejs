<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – 7dejsPCD</title><meta name="theme-color" content="#050b1f"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>:root{--bg:#050b1f;--bg2:#0a1636;--blue:#2f6bff;--cyan:#3de0ff;--text:#e8f1ff;--muted:#9fb4e0;--line:rgba(80,140,255,.28);
--head:"Unbounded","Trebuchet MS",sans-serif;--body:"Manrope","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 17px/1.65 var(--body);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

nav{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;transition:background .3s,backdrop-filter .3s}
nav.solid{background:rgba(5,11,31,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .logo{font:800 15px var(--head);text-decoration:none;letter-spacing:.02em}
nav .links a{text-decoration:none;color:var(--muted);font-weight:600;margin-left:24px;font-size:15px;transition:color .2s}
nav .links a:hover,nav .links a[aria-current]{color:var(--cyan)}

.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:0 20px}
.hero::before{content:"";position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax;
background:radial-gradient(circle at 30% 40%,rgba(47,107,255,.55),transparent 35%),radial-gradient(circle at 70% 60%,rgba(61,224,255,.35),transparent 32%);
animation:drift 22s linear infinite}
.streak{position:absolute;left:0;height:2px;width:38vw;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.55;animation:streak 5s linear infinite}
.s1{top:24%}.s2{top:68%;animation-delay:-2s;animation-duration:6.5s}.s3{top:82%;animation-delay:-3.5s;width:26vw}.s4{top:12%;animation-delay:-1s;animation-duration:7.5s;width:20vw}
.hero h1{position:relative;font:800 clamp(40px,11vw,150px)/1 var(--head);letter-spacing:-.03em;text-shadow:0 0 50px rgba(47,107,255,.9),0 0 120px rgba(61,224,255,.35)}
.ch{display:inline-block;opacity:0;transform:translateY(60px) scale(.9);animation:rise .8s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i)*.07s + .2s)}
.cue{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:10px;color:var(--muted);font-size:14px;text-decoration:none}
.cue i{width:2px;height:46px;background:linear-gradient(var(--cyan),transparent);animation:cue 1.8s ease-in-out infinite}

section{padding:110px 0}
.alt{background:linear-gradient(180deg,var(--bg),var(--bg2) 50%,var(--bg))}
h2{font:800 clamp(28px,4.6vw,48px)/1.12 var(--head);letter-spacing:-.02em;margin-bottom:22px}
.lead{color:var(--muted);font-size:19px;max-width:60ch}
.lead+.lead{margin-top:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:44px}
.shot{border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px -20px rgba(47,107,255,.55)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:16/10;transition:transform .6s}
.shot:hover img{transform:scale(1.06)}
.avatars{width:100%;max-width:460px;justify-self:center;filter:drop-shadow(0 0 40px rgba(47,107,255,.6));animation:float 6s ease-in-out infinite}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:700;text-decoration:none;background:linear-gradient(120deg,var(--blue),var(--cyan));color:#03102e;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px -8px rgba(61,224,255,.7)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--cyan);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:40px}
.team{padding:28px;border-radius:18px;border:1px solid var(--line);background:rgba(20,40,95,.35);transition:transform .3s,border-color .3s}
.team:hover{transform:translateY(-6px);border-color:var(--cyan)}
.team h3{font:600 14px var(--head);color:var(--cyan);margin-bottom:12px}
.team p{font-size:24px;font-weight:700;line-height:1.35}
.page-head{padding:170px 0 60px;position:relative;overflow:hidden}
.page-head::before{content:"";position:absolute;width:90vmax;height:90vmax;left:60%;top:-50vmax;background:radial-gradient(circle,rgba(47,107,255,.4),transparent 60%)}
.page-head h1{position:relative;font:800 clamp(36px,8vw,92px)/1 var(--head);letter-spacing:-.03em}
.page-head .lead{position:relative;margin-top:22px}
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{text-decoration:none;margin-left:18px}footer a:hover{color:var(--cyan)}

.reveal{opacity:0;transform:translateY(46px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes streak{from{transform:translateX(-60vw)}to{transform:translateX(130vw)}}
@keyframes drift{to{transform:rotate(360deg)}}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1)}}
@keyframes float{50%{transform:translateY(-14px)}}
@media (max-width:760px){.split,.shots{grid-template-columns:1fr}section{padding:80px 0}nav .links a{margin-left:14px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ch,.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,11,31,.35),var(--bg) 96%)}
.hero h1,.cue,.streak{z-index:2}
.hero h1 .ch{background:linear-gradient(180deg,#fff 30%,#9fc4ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 28px rgba(47,107,255,.85))}
.ribbon{overflow:hidden;border-block:1px solid var(--line);background:rgba(20,40,95,.3);padding:16px 0;white-space:nowrap}
.ribbon div{display:inline-block;font:800 clamp(18px,3vw,28px) var(--head);letter-spacing:.02em;color:transparent;-webkit-text-stroke:1px var(--cyan);animation:marq 28s linear infinite}
.ribbon span{margin:0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:44px}
.card{position:relative;padding:30px 28px;border-radius:20px;background:linear-gradient(160deg,rgba(47,107,255,.22),rgba(10,22,54,.6));border:1px solid var(--line);overflow:hidden;transition:transform .35s,border-color .35s,box-shadow .35s}
.card::before{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-60px;background:radial-gradient(circle,rgba(61,224,255,.35),transparent 70%)}
.card:hover{transform:translateY(-8px);border-color:var(--cyan);box-shadow:0 24px 50px -24px rgba(61,224,255,.6)}
.card h3{font:600 17px var(--head);margin-bottom:10px;position:relative}
.card p{color:var(--muted);font-size:16px;position:relative}
.shot figcaption{padding:12px 16px;font-size:14px;color:var(--muted);background:rgba(5,11,31,.85)}
.shot{margin:0;position:relative}
.nav-solid{}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes zoom{to{transform:scale(1.2)}}
</style>
<style>
.nf{position:relative;z-index:2;display:grid;justify-items:center;padding:90px 0 40px}
.num{position:absolute;top:40px;left:50%;transform:translateX(-50%);font:800 clamp(140px,34vw,380px)/1 var(--head);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px rgba(61,224,255,.35);text-shadow:0 0 80px rgba(47,107,255,.5);user-select:none;pointer-events:none}
.robot{position:relative;width:min(300px,70vw);height:auto;filter:drop-shadow(0 0 40px rgba(47,107,255,.55))}
.arm{animation:shrug 3.4s ease-in-out infinite}
.head{transform-origin:150px 150px;animation:tilt 3.4s ease-in-out infinite}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4.2s infinite}
.tip{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.q{font:800 34px var(--head);fill:var(--cyan);opacity:0;animation:q 3.4s ease-in-out infinite}
.q2{animation-delay:.25s}
.shadow{transform-origin:center;transform-box:fill-box;animation:sh 3.4s ease-in-out infinite}
.nf h1{font:800 clamp(26px,4.6vw,44px)/1.15 var(--head);margin:26px 0 12px;position:relative}
.nf p{color:var(--muted);max-width:42ch;position:relative}
.nf .row{justify-content:center;position:relative}
@keyframes shrug{0%,12%,70%,100%{transform:translateY(0)}28%,58%{transform:translateY(-18px)}}
@keyframes tilt{0%,12%,70%,100%{transform:rotate(0)}28%,58%{transform:rotate(-5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{50%{opacity:.45;transform:scale(1.35)}}
@keyframes q{0%,15%{opacity:0;transform:translateY(10px)}35%,58%{opacity:1;transform:translateY(-8px)}80%,100%{opacity:0;transform:translateY(-22px)}}
@keyframes sh{28%,58%{transform:scaleX(.82);opacity:.6}}
</style></head>
